<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Connect WhatsApp Number | Dleading</title>
<style>
:root{--o:#F65901;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#faf8f6}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
button{margin-top:12px;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;color:#fff;background:linear-gradient(135deg,#F69D01,#F65901);cursor:pointer}
button:disabled{opacity:.5}
.out{margin-top:10px;font-size:14px;white-space:pre-wrap}
.ok{color:#166534}.err{color:#b91c1c}
h2{font-size:17px;margin:0}
.n{display:inline-block;width:24px;height:24px;border-radius:50%;background:var(--o);color:#fff;text-align:center;font-size:14px;line-height:24px;margin-right:6px}
</style>
</head>
<body>
<main>
<h1>Connect the AI WhatsApp number</h1>
<p style="color:var(--mute);margin:0">Number: <strong id="numLabel">+44 7383 827715</strong>. It must not be on any WhatsApp app.</p>

<div class="card">
  <h2><span class="n">1</span>Add number &amp; send code</h2>
  <label for="method">Send code by</label>
  <select id="method"><option value="SMS">SMS</option><option value="VOICE">Voice call</option></select>
  <button data-step="add_and_send">Add number &amp; send code</button>
  <div class="out" id="o-add_and_send"></div>
</div>

<div class="card">
  <h2><span class="n">2</span>Enter the code</h2>
  <label for="key">Setup key (WHATSAPP_VERIFY_TOKEN from Vercel)</label>
  <input id="key" type="password" autocomplete="off">
  <label for="code">6-digit code you received</label>
  <input id="code" inputmode="numeric" maxlength="7" autocomplete="one-time-code">
  <button data-step="verify_code">Verify code</button>
  <div class="out" id="o-verify_code"></div>
</div>

<div class="card">
  <h2><span class="n">3</span>Register with a PIN</h2>
  <label for="pin">Choose a 6-digit PIN and keep it safe</label>
  <input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
  <button data-step="register">Register number</button>
  <div class="out" id="o-register"></div>
</div>
</main>
<script>
let phoneId = "";
try { phoneId = sessionStorage.getItem("dl_new_phone") || ""; } catch {}
const call = (body) => fetch("/api/connect-number", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }).then((r) => r.json());
document.querySelectorAll("button[data-step]").forEach((b) => b.onclick = async () => {
  const step = b.dataset.step, out = document.getElementById("o-" + step);
  if (step === "register" && !confirm("Register +44 7383 827715 for the AI now?")) return;
  b.disabled = true; out.className = "out"; out.textContent = "Working…";
  try {
    let d;
    if (step === "add_and_send") {
      const a = await call({ step: "add_number", number: "07383827715" });
      if (!a.ok) throw new Error(a.error);
      phoneId = a.data?.id || phoneId;
      try { sessionStorage.setItem("dl_new_phone", phoneId); } catch {}
      d = await call({ step: "request_code", phone_id: phoneId, method: document.getElementById("method").value });
    } else {
      d = await call({ step, phone_id: phoneId, key: document.getElementById("key").value,
        code: document.getElementById("code").value, pin: document.getElementById("pin").value });
    }
    out.className = "out " + (d.ok ? "ok" : "err");
    out.textContent = d.ok ? (d.message || "Done") : d.error;
  } catch (e) { out.className = "out err"; out.textContent = e.message; }
  b.disabled = false;
});
</script>
</body>
</html>
